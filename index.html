<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل تطبيق ونظام بيت الراشد</title>
    <style>
        * {
            box-sizing: border-box;
        }

        /* 🌟 أنيميشن لتحريك الخلفية ببطء */
        @keyframes cinematicZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        body {
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background-color: #164841;
        }

        /* 🌟 الطبقة الخلفية المتحركة */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(22, 72, 65, 0.85), rgba(16, 52, 47, 0.95)), url('https://lfgzdsbklhyaqnyiquta.supabase.co/storage/v1/object/public/bait-alrashid/page-download/logo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            animation: cinematicZoom 25s infinite alternate ease-in-out;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 35px 25px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            position: relative;
            z-index: 10;
        }

        img.logo {
            width: 110px;
            height: 110px;
            border-radius: 26px;
            object-fit: cover;
            border: 3px solid #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 15px;
        }

        h1 {
            font-size: 22px;
            margin: 0 0 8px 0;
            font-weight: bold;
        }

        p {
            font-size: 13px;
            color: #e0e0e0;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .btn svg {
            width: 26px;
            height: 26px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* زر الأندرويد */
        .btn-android {
            background-color: #23A38B;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-android:hover {
            background-color: #1c8873;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        /* 🌟 زر الويندوز للمسؤولين والإداريين */
        .btn-windows {
            background-color: #0f2c27;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .btn-windows:hover {
            background-color: #081a17;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .btn span {
            display: flex;
            flex-direction: column;
            text-align: right;
        }

        .btn small {
            font-size: 11px;
            font-weight: normal;
            opacity: 0.85;
            margin-top: 3px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- صورة الشعار -->
    <img src="logo.jpg" alt="شعار بيت الراشد" class="logo">

    <h1>منظومة بيت الراشد</h1>
    <p>اختر النسخة المناسبة لجهازك للتحميل والمتابعة.</p>

</body>
</html>
